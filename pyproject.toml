[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-police"
version = "0.1.0"
description = "Audit LLM API routers for tool-call tampering, credential exfiltration and supply-chain risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-police = "agentpolice.cli:main"

[tool.setuptools.packages.find]
include = ["agentpolice*"]

[tool.setuptools.package-data]
agentpolice = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
