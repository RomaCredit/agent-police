[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-police"
version = "0.2.0"
description = "Audit LLM API routers for tool-call tampering, credential exfiltration and supply-chain risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RomaCredit" }]
keywords = [
    "llm", "security", "supply-chain", "tool-calling", "api-gateway",
    "prompt-injection", "canary-token", "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tests/test_packaging.py reads pyproject.toml; tomllib is 3.11+ and this
    # package still supports 3.10.
    "tomli>=2.0; python_version < '3.11'",
]
# `agent-police serve` needs these. They are an extra rather than a hard
# dependency because the common case is the CLI, and a scanner should not drag
# a web framework onto a machine that will only ever run `audit`.
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.urls]
Homepage = "https://github.com/RomaCredit/agent-police"
Repository = "https://github.com/RomaCredit/agent-police"
Issues = "https://github.com/RomaCredit/agent-police/issues"

[project.scripts]
agent-police = "agentpolice.cli:main"

[tool.setuptools.packages.find]
include = ["agentpolice*"]

[tool.setuptools.package-data]
# The web UI is data, not code, so it only ships if it is listed here. It was
# not, which meant every published wheel carried `agent-police serve` as an
# advertised command with no pages behind it. `tests/test_packaging.py` now
# asserts every file under server/static is matched by one of these patterns,
# because adding a subdirectory (as `en/` did) silently breaks a flat glob.
agentpolice = [
    "data/*.json",
    "server/static/*",
    "server/static/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Must match requires-python, not the newest interpreter in the CI matrix.
# At py312 ruff was happy to rewrite code into forms that do not run on 3.10,
# which the package claims to support and CI actually tests.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "FURB"]
ignore = [
    # The auditor talks to endpoints that are assumed hostile. A broad except
    # around every network and parsing boundary is the design: a probe that
    # raises on a malformed response loses the evidence it was sent to collect.
    # Each one records the error and continues.
    "BLE001",
    # Long explanatory comments and evidence strings are the point in a tool
    # whose output has to justify a security finding.
    "E501",
    # str+Enum rather than StrEnum is deliberate: StrEnum changes how a member
    # formats in an f-string, and these values are rendered into reports and
    # compared against JSON from earlier runs.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately build odd payloads and import inside functions.
"tests/*" = ["B011", "PLR2004", "RUF059"]
