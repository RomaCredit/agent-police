name: ci

# Images are built here, never on the server that serves them. The production
# host runs other services; a build there competes for its resources and can
# disrupt them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python claims. 3.12 is what the image ships,
        # 3.14 is what the project is developed on; the drift that motivated
        # this job was a suite passing on one while production ran the other.
        # 3.10 and 3.11 are here so the floor in pyproject.toml is a tested
        # claim rather than an assumed one.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # On 3.12 pin to constraints.txt, the exact set the image ships, so a
        # green suite there means the same thing in production. On the other
        # versions install the loose ranges from pyproject.toml, which is what
        # someone who pip-installs the package actually gets.
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -c constraints.txt ".[dev]" fastapi "uvicorn[standard]"
          else
            pip install ".[dev]" fastapi "uvicorn[standard]"
          fi

      - name: Lint
        run: |
          pip install ruff
          ruff check agentpolice tests

      - name: Test
        # One guard test resolves api.anthropic.com to prove the SSRF check
        # admits a real public host, so this step needs outbound DNS.
        run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SKIP_TESTS stays at its default of 0: the image's own first stage
          # re-runs the suite on the interpreter it ships, so a pushed image
          # always carries a passing run, independent of the job above.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment hint
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "On the server:"
          echo "  cd /root/agent-police"
          echo "  AGENT_POLICE_IMAGE=ghcr.io/${{ github.repository }}:latest \\"
          echo "    docker compose pull && docker compose up -d"
